#user  nobody;
worker_processes  1;

error_log  logs/error.log;
# error_log  logs/error.log  notice;
# error_log  logs/error.log  error;
# error_log  logs/error.log  info;

pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";

    resolver 127.0.0.11 valid=10s;

    lua_shared_dict ip_blacklist 10m;

    log_format json_combined escape=json
        '{'
            '"time_local":"$time_local",'
            '"time_iso8601":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"request_id":"$request_id",'
            '"request_length":"$request_length",'
            '"status":"$status",'
            '"bytes_sent":"$bytes_sent",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"request_time":"$request_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"server_name":"$server_name",'
            '"host":"$host",'
            '"server_protocol":"$server_protocol",'
            '"http_host":"$http_host",'
            '"connection":"$connection",'
            '"service":"api_gateway"'
        '}';

    log_format api_metrics escape=json
        '{'
            '"time_iso8601":"$time_iso8601",'
            '"api_name":"$api_name",'
            '"endpoint":"$uri",'
            '"status":"$status",'
            '"request_time":"$request_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"client_ip":"$remote_addr",'
            '"bytes_sent":"$bytes_sent",'
            '"request_method":"$request_method",'
            '"service":"api_metrics"'
        '}';

    map $uri $api_name {
        ~^/api/hub/(.*)    "hub";
        ~^/api/easysign/(.*) "easysign";
        default            "unknown";
    }

    access_log logs/access.log json_combined;
    access_log logs/api_metrics.log api_metrics;

    init_by_lua_block {
        resty_redis = require "resty.redis"
        cjson = require "cjson"

        ngx.log(ngx.INFO, "Loaded all Lua libraries into OpenResty!")
    }

    init_worker_by_lua_block {
        local timer_created = false

        function setup_blacklist_timer()
            if timer_created then
                return
            end

            timer_created = true

            local function load_blacklist_from_redis()
                local redis_helper = require "redishelper"

                local ok, red_or_err = pcall(redis_helper.connect)
                if not ok or not red_or_err then
                    ngx.log(ngx.ERR, "Failed to connect to Redis: ", red_or_err)
                    return
                end

                local red = red_or_err

                local ok, keys_or_err = pcall(function() return red:keys("blacklist:*") end)
                if not ok or not keys_or_err then
                    ngx.log(ngx.ERR, "Failed to get blacklisted keys: ", keys_or_err)
                    red:set_keepalive(1000000, 100)
                    return
                end

                local blacklisted_ips = {}
                for _, key in ipairs(keys_or_err) do
                    local ip = key:match("blacklist:(.*)")
                    if ip then
                        table.insert(blacklisted_ips, ip)

                        local ttl, err = red:ttl(key)
                        if ttl and ttl > 0 then
                            ngx.shared.ip_blacklist:set(ip, true, ttl)
                        else
                            ngx.shared.ip_blacklist:set(ip, true, 60)
                        end
                    end
                end

                red:set_keepalive(1000000, 100)
                ngx.log(ngx.INFO, "Successfully loaded " .. #blacklisted_ips .. " IPs into blacklist")
            end

            local ok, err = ngx.timer.at(0, function() load_blacklist_from_redis() end)
            if not ok then
                ngx.log(ngx.ERR, "Failed to create immediate timer: ", err)
            end

            local ok, err = ngx.timer.every(60, function() load_blacklist_from_redis() end)
            if not ok then
                ngx.log(ngx.ERR, "Failed to create periodic timer: ", err)
            else
                ngx.log(ngx.INFO, "Successfully set up periodic blacklist refresh")
            end
        end
    }

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

#     access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 8080;
        server_name localhost;

        access_by_lua_block {
            -- Set up blacklist refresh timer if not already done
            if setup_blacklist_timer then
                setup_blacklist_timer()
                -- We can remove the function after it's called to free up memory
                setup_blacklist_timer = nil
            end

            local redis_helper = require "redishelper"
            local ip = ngx.var.remote_addr

            if ngx.shared.ip_blacklist:get(ip) then
                ngx.log(ngx.WARN, "Blocked request from blacklisted IP: ", ip)
                return ngx.exit(403)
            end

            local ngx_time = ngx.now
            local window = math.floor(ngx_time() / 60)  -- One-minute window
            local key = "rate:" .. ip .. ":" .. window

            local rate_limit = 10
            local count, err = redis_helper.incr_and_expire(key, rate_limit, 60) -- 10 requests per minute

            if not count then
                ngx.log(ngx.ERR, "Redis error: ", err)
                return ngx.exit(500)
            end

            if count > rate_limit then
                ngx.log(ngx.WARN, "Rate limit exceeded for IP: ", ip)

                local should_blacklist, violations = redis_helper.check_violations(ip, 5)  -- Blacklist after 5 violations

                if should_blacklist then
                    local ok, err = redis_helper.add_to_blacklist(ip)
                    if ok then
                        ngx.log(ngx.WARN, "IP has been blacklisted after ", violations, " violations: ", ip)
                    else
                        ngx.log(ngx.ERR, "Failed to blacklist IP: ", err)
                    end
                end

                return ngx.exit(429)
            end
        }

        location / {
            content_by_lua_block {
                local start_time = ngx.now()
                local gateway = require "gateway_routing"
                local res, err = gateway.route()
                local process_time = ngx.now() - start_time

                ngx.log(ngx.INFO, string.format(
                    "API_METRICS uri=%s status=%s time=%.3f upstream=%s",
                    ngx.var.uri,
                    res and res.status or "error",
                    process_time,
                    res and res.headers["X-Upstream"] or "none"
                ))


                if not res then
                    ngx.status = 500
                    ngx.say(require("cjson").encode({error = err or "Internal Error"}))
                    return
                end

                ngx.status = res.status
                for k, v in pairs(res.headers) do
                    if k ~= "Transfer-Encoding" and k ~= "Connection" then
                        ngx.header[k] = v
                    end
                end


                if res.body then
                    ngx.print(res.body)
                end
            }
        }
    }

    # Additional server blocks...
}