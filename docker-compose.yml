version: '3.9'

services:
  openresty:
    build:
      context: .
      dockerfile: ./openresty.Dockerfile
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    depends_on:
      - keycloak
      - redis
      - logstash
    environment:
      - KEYCLOAK_URL=http://keycloak:9090
      - FRONTEND_URL=http://localhost:8081
    volumes:
      - ./openresty_logs:/usr/local/openresty/nginx/logs
    networks:
      - my_network
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      DB_VENDOR: POSTGRES
      DB_ADDR: postgres
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: password
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_FRONTEND_URL: http://localhost:9090
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - 9090:9090
      - 8443:8443
    depends_on:
      - postgres
    command: ["start-dev", "--http-port=9090"]
    restart: always
    networks:
      - my_network

  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - my_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=changeme
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - my_network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.5.0
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config:/usr/share/logstash/config
    environment:
      - xpack.monitoring.enabled=false
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "5044:5044"  # Beats input
      - "5000:5000"  # TCP input
      - "9600:9600"  # Monitoring API
    depends_on:
      - elasticsearch
    networks:
      - my_network

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.5.0
    container_name: filebeat
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./openresty_logs:/usr/local/openresty/nginx/logs:ro
#      - openresty_logs:/usr/local/openresty/nginx/logs:ro
    command: filebeat -e -strict.perms=false
    depends_on:
      - logstash
      - openresty
    networks:
      - my_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.5.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - my_network

  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"  # Expose Redis on port 6379
    networks:
      - my_network
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  keycloak_postgres_data:
  es_data:
    driver: local
  openresty_logs:
    driver: local

networks:
  my_network:  # Define the custom network
    driver: bridge  # Use the default bridge network driver