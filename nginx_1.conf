#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";

    resolver 127.0.0.11 valid=10s;

    lua_shared_dict ip_blacklist 10m;
    
    init_by_lua_block {
        resty_redis = require "resty.redis"
        local limit_req = require "resty.limit.req"
        cjson = require "cjson"
        service_router = require "service_router"

        ngx.log(ngx.INFO, "Loaded all Lua libraries into OpenResty!")
    }

    init_worker_by_lua_block {
        -- We'll use a flag to track if the timer has been set
        local timer_created = false

        -- Create a function that will be called to set up the timer
        -- This will be called during the first request processing
        function setup_blacklist_timer()
            -- Only create the timer once
            if timer_created then
                return
            end

            timer_created = true

            local function load_blacklist_from_redis()
                local redis_helper = require "redishelper"

                -- Use pcall to handle potential errors during Redis operations
                local ok, red_or_err = pcall(redis_helper.connect)
                if not ok or not red_or_err then
                    ngx.log(ngx.ERR, "Failed to connect to Redis: ", red_or_err)
                    return
                end

                local red = red_or_err
                local ok, blacklisted_ips_or_err = pcall(function() return red:smembers("ip_blacklist") end)
                if not ok or not blacklisted_ips_or_err then
                    ngx.log(ngx.ERR, "Failed to get blacklisted IPs: ", blacklisted_ips_or_err)
                    red:set_keepalive(1000000, 100)
                    return
                end

                local blacklisted_ips = blacklisted_ips_or_err

                -- Clear old list
                ngx.shared.ip_blacklist:flush_all()

                -- Add IPs to blacklist
                for _, ip in ipairs(blacklisted_ips) do
                    ngx.shared.ip_blacklist:set(ip, true)
                end

                red:set_keepalive(1000000, 100)
                ngx.log(ngx.INFO, "Successfully loaded " .. #blacklisted_ips .. " IPs into blacklist")
            end

            -- Schedule immediate loading
            local ok, err = ngx.timer.at(0, function() load_blacklist_from_redis() end)
            if not ok then
                ngx.log(ngx.ERR, "Failed to create immediate timer: ", err)
            end

            -- Set up periodic timer (every 60 seconds)
            local ok, err = ngx.timer.every(60, function() load_blacklist_from_redis() end)
            if not ok then
                ngx.log(ngx.ERR, "Failed to create periodic timer: ", err)
            else
                ngx.log(ngx.INFO, "Successfully set up periodic blacklist refresh")
            end
        end
    }

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 8080;
        server_name localhost;

        set $target_upstream "";

        # Server-level access block - will apply to ALL locations
        access_by_lua_block {
            -- Set up blacklist refresh timer if not already done
            if setup_blacklist_timer then
                setup_blacklist_timer()
                -- We can remove the function after it's called to free up memory
                setup_blacklist_timer = nil
            end

            local redis_helper = require "redishelper"
            local ip = ngx.var.remote_addr

            -- Step 1: Check if IP is already blacklisted
            if ngx.shared.ip_blacklist:get(ip) then
                ngx.log(ngx.WARN, "Blocked request from blacklisted IP: ", ip)
                return ngx.exit(403)
            end

            -- Step 2: Apply rate limiting to all requests
            local ngx_time = ngx.now
            local window = math.floor(ngx_time() / 60)  -- One-minute window
            local key = "rate:" .. ip .. ":" .. window

            -- Get rate limit and check if exceeded
            local rate_limit = 10  -- 10 requests per minute
            local count, err = redis_helper.incr_and_expire(key, rate_limit, 60)

            if not count then
                ngx.log(ngx.ERR, "Redis error: ", err)
                return ngx.exit(500)
            end

            if count > rate_limit then
                ngx.log(ngx.WARN, "Rate limit exceeded for IP: ", ip)

                -- Check if this IP has repeatedly violated the rate limit
                local should_blacklist, violations = redis_helper.check_violations(ip, 5)  -- Blacklist after 5 violations

                if should_blacklist then
                    local ok, err = redis_helper.add_to_blacklist(ip)
                    if ok then
                        ngx.log(ngx.WARN, "IP has been blacklisted after ", violations, " violations: ", ip)
                    else
                        ngx.log(ngx.ERR, "Failed to blacklist IP: ", err)
                    end
                end

                return ngx.exit(429)
            end
        }

        # Authentication endpoints for each service
        # Hub service authentication
        location ~ ^/hub/authorization/gettoken {
            content_by_lua_block {
                service_router.handle_auth_request()
            }
        }

        # EasySign service authentication
        location ~ ^/easysign/authenticate {
            content_by_lua_block {
                service_router.handle_auth_request()
            }
        }

        # Generic pattern for other potential authentication endpoints
        location ~ ^/(serviceX|service1|service2)/(auth|login) {
            content_by_lua_block {
                service_router.handle_auth_request()
            }
        }

        # Regular service endpoints
        location / {
            access_by_lua_block {
                service_router.handle_routing_request()
            }

            proxy_pass http://$target_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Additional server blocks...
}