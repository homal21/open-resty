# /logstash/pipeline/nginx.conf
input {
  beats {
    port => 5044
  }
}

filter {
  # Chung cho mọi log
  mutate {
    add_field => {
      "[app][name]" => "api-gateway"
    }
  }

  # Xử lý access logs
  if [type] == "access" {
    # Chuyển đổi trường thời gian
    date {
      match => ["time_iso8601", "ISO8601"]
      target => "@timestamp"
      remove_field => ["time_iso8601"]
    }

    # Chuyển đổi kiểu dữ liệu
    mutate {
      convert => {
        "status" => "integer"
        "bytes_sent" => "integer"
        "request_time" => "float"
        "upstream_response_time" => "float"
        "request_length" => "integer"
        "body_bytes_sent" => "integer"
      }
    }

    # Phân tích URL để lấy thông tin chi tiết
    ruby {
      code => '
        uri = event.get("request_uri")
        if uri
          parts = uri.split("?")
          event.set("uri_path", parts[0])
          if parts.length > 1
            event.set("uri_query", parts[1])
          end
        end
      '
    }

    # Phân loại API
    if [request_uri] =~ "^/api/hub/" {
      mutate {
        add_field => { "[api][type]" => "hub" }
      }
    } else if [request_uri] =~ "^/api/easysign/" {
      mutate {
        add_field => { "[api][type]" => "easysign" }
      }
    }
  }

  # Xử lý metrics logs
  else if [type] == "metrics" {
    date {
      match => ["time_iso8601", "ISO8601"]
      target => "@timestamp"
      remove_field => ["time_iso8601"]
    }

    mutate {
      convert => {
        "status" => "integer"
        "request_time" => "float"
      }
    }
  }

  # Xử lý error logs
  else if [type] == "error" {
    grok {
      match => { "message" => "%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME} \[%{LOGLEVEL:log_level}\] %{NOTSPACE:pid}#%{NOTSPACE:tid}: (\*%{NUMBER:connection_id} )?(?<error_message>.*)" }
    }

    # Xử lý riêng log của Lua
    if [error_message] =~ "^\[lua\]" {
      grok {
        match => { "error_message" => "\[lua\] %{GREEDYDATA:lua_message}" }
      }
    }

    # Tạo timestamp
    date {
      match => [ "timestamp", "yyyy/MM/dd HH:mm:ss" ]
      target => "@timestamp"
    }

    # Phân loại mức độ lỗi
    if [log_level] == "error" or [log_level] == "crit" or [log_level] == "alert" or [log_level] == "emerg" {
      mutate {
        add_field => { "[log][level]" => "error" }
      }
    } else if [log_level] == "warn" or [log_level] == "warning" {
      mutate {
        add_field => { "[log][level]" => "warning" }
      }
    } else {
      mutate {
        add_field => { "[log][level]" => "info" }
      }
    }
  }

  # Thêm thông tin về địa lý dựa trên IP
  if [remote_addr] {
    geoip {
      source => "remote_addr"
      target => "geo"
    }
  }

  # Thêm thông tin về user agent
  if [http_user_agent] {
    useragent {
      source => "http_user_agent"
      target => "user_agent"
    }
  }
}

output {
  # Đầu ra phụ thuộc vào loại log
  if [type] == "access" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "nginx-access-%{+YYYY.MM.dd}"
    }
  }
  else if [type] == "metrics" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "nginx-metrics-%{+YYYY.MM.dd}"
    }
  }
  else if [type] == "error" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "nginx-error-%{+YYYY.MM.dd}"
    }
  }
  else {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "nginx-logs-%{+YYYY.MM.dd}"
    }
  }

  # Output cho việc debug - có thể comment sau khi đã triển khai thành công
  # stdout { codec => rubydebug }
}